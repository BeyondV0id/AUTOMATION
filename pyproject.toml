[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-automation-latex"
version = "0.1.0"
description = "Verified-data job discovery and LaTeX resume automation"
requires-python = ">=3.11"
dependencies = []
optional-dependencies = { excel = ["openpyxl>=3.1"], browser = ["playwright>=1.40"], pdf = ["pypdf>=4", "pymupdf>=1.24"] }

[tool.setuptools.packages.find]
include = ["resume_pipeline*"]
